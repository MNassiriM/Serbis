version: "3.9"

networks:
  generp-network:
    driver: bridge

volumes:
  etcd_data:
  apisix_logs:

services:
  # -------------------------------------------------------
  # Backend — FastAPI
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: generp-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APISIX_ADMIN_URL=http://apisix:9180
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - generp-network
    depends_on:
      apisix:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------
  # Frontend — Next.js
  # -------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: generp-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - generp-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------
  # etcd — Required by APISIX
  # -------------------------------------------------------
  etcd:
    image: bitnami/etcd:3.5.16
    container_name: generp-etcd
    restart: unless-stopped
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - generp-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------
  # APISIX — API Gateway
  # -------------------------------------------------------
  apisix:
    image: apache/apisix:3.11.0-debian
    container_name: generp-apisix
    restart: unless-stopped
    volumes:
      - ./apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - apisix_logs:/usr/local/apisix/logs
    ports:
      - "9080:9080"   # proxy HTTP
      - "9443:9443"   # proxy HTTPS
      - "9180:9180"   # admin API
    networks:
      - generp-network
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9180/apisix/admin/routes", "-H", "X-API-KEY: edd1c9f034335f136f87ad84b625c8f1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------
  # APISIX Dashboard (optional, dev only)
  # -------------------------------------------------------
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: generp-apisix-dashboard
    restart: unless-stopped
    volumes:
      - ./apisix/conf/dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
    ports:
      - "9000:9000"
    networks:
      - generp-network
    depends_on:
      - apisix
